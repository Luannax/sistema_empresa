<!-- Script para configurar o navbar -->
<script>
// Variável global para controlar se já foi inicializado
window.navbarInicializado = false;

// Função principal para configurar navbar
async function configurarNavbar() {
    if (window.navbarInicializado) return;
    
    console.log('🔧 Iniciando configuração do navbar...');
    
    try {
        // Aguardar AuthManager ficar disponível (máximo 5 segundos)
        let tentativas = 0;
        while (!window.AuthManager && tentativas < 50) {
            await new Promise(resolve => setTimeout(resolve, 100));
            tentativas++;
        }
        
        let usuario = null;
        
        // Tentar obter usuário pelo AuthManager
        if (window.AuthManager) {
            try {
                usuario = await window.AuthManager.obterUsuarioAtual();
                console.log('✅ Usuário obtido pelo AuthManager:', usuario?.nome);
            } catch (error) {
                console.log('⚠️ Erro no AuthManager, tentando fallback');
            }
        }
        
        // Fallback: tentar função global
        if (!usuario && typeof obterUsuarioLogado === 'function') {
            try {
                usuario = await obterUsuarioLogado();
                console.log('✅ Usuário obtido por fallback:', usuario?.nome);
            } catch (error) {
                console.log('⚠️ Fallback também falhou');
            }
        }
        
        // Se conseguiu obter usuário, configurar navbar
        if (usuario && usuario.nome) {
            atualizarNavbarComUsuario(usuario);
            window.navbarInicializado = true;
            console.log('🎉 Navbar configurado com sucesso!');
        } else {
            console.log('❌ Não foi possível obter dados do usuário');
            // Tentar novamente em 1 segundo
            setTimeout(configurarNavbar, 1000);
        }
        
    } catch (error) {
        console.error('❌ Erro ao configurar navbar:', error);
        // Tentar novamente em 2 segundos
        setTimeout(configurarNavbar, 2000);
    }
}

function atualizarNavbarComUsuario(usuario) {
    // Atualizar nome do usuário
    const nomeElement = document.getElementById('nomeUsuarioNavbar');
    if (nomeElement && usuario.nome) {
        nomeElement.textContent = usuario.nome;
        console.log('✅ Nome atualizado:', usuario.nome);
    }
    
    // Configurar permissões
    configurarPermissoesNavbar(usuario);
    
    // Marcar página ativa
    marcarPaginaAtiva();
}

// Executar quando DOM estiver pronto
if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', function() {
        setTimeout(configurarNavbar, 500); // Aguardar scripts carregarem
    });
} else {
    setTimeout(configurarNavbar, 500);
}

async function configurarPermissoesNavbar(usuario) {
    // Elementos que são só para ADM
    const elementosAdmin = [
        'navDashboard',  // Dashboard só para ADM
        'navUsuarios',   // Usuários só para ADM
        'navClientes',   // Clientes só para ADM
        'navFornecedores', // Fornecedores só para ADM
        'navUsuariosMobile'  // Usuários mobile só para ADM
    ];
    
    // Elementos visíveis para todos os usuários
    const elementosTodos = [
        'navPedidos',    // Novo Pedido para todos
        'navRelatorios'  // Relatórios para todos
    ];
    
    if (usuario.prioridade === 'ADM') {
        console.log('👑 Configurando navbar para ADMINISTRADOR');
        
        // Mostrar elementos de admin
        elementosAdmin.forEach(id => {
            const elemento = document.getElementById(id);
            if (elemento) {
                elemento.classList.remove('d-none');
                console.log(`✅ Mostrando ${id} para admin`);
            }
        });
        
        // Garantir que elementos comuns também estão visíveis
        elementosTodos.forEach(id => {
            const elemento = document.getElementById(id);
            if (elemento) {
                elemento.classList.remove('d-none');
            }
        });
        
    } else {
        console.log('👤 Configurando navbar para VENDEDOR');
        
        // Ocultar elementos de admin
        elementosAdmin.forEach(id => {
            const elemento = document.getElementById(id);
            if (elemento) {
                elemento.classList.add('d-none');
                console.log(`❌ Ocultando ${id} para vendedor`);
            }
        });
        
        // Mostrar apenas elementos permitidos para vendedores
        elementosTodos.forEach(id => {
            const elemento = document.getElementById(id);
            if (elemento) {
                elemento.classList.remove('d-none');
                console.log(`✅ Mostrando ${id} para vendedor`);
            }
        });
    }
}

function marcarPaginaAtiva() {
    // Remover active de todos
    document.querySelectorAll('.nav-link').forEach(link => {
        link.classList.remove('active');
    });
    
    // Mapear páginas para IDs
    const paginaAtual = window.location.pathname;
    const mapeamento = {
        '/pages/dashboard.html': 'navDashboard',
        '/pages/pedido.html': 'navPedidos', 
        '/pages/relatorio.html': 'navRelatorios',
        '/pages/usuarios.html': 'navUsuarios',
        '/pages/clientes.html': 'navClientes',
        '/pages/fornecedores.html': 'navFornecedores'
    };
    
    const navId = mapeamento[paginaAtual];
    if (navId) {
        const navItem = document.querySelector(`#${navId} .nav-link`);
        if (navItem) {
            navItem.classList.add('active');
        }
    }
}

// Função de logout simples e robusta
async function realizarLogout() {
    console.log('🚪 Iniciando logout...');
    
    try {
        // Mostrar confirmação
        const result = await Swal.fire({
            icon: 'question',
            title: 'Confirmar Logout',
            text: 'Deseja realmente sair do sistema?',
            showCancelButton: true,
            confirmButtonText: 'Sim, sair',
            cancelButtonText: 'Cancelar',
            confirmButtonColor: '#dc3545',
            cancelButtonColor: '#6c757d'
        });
        
        if (!result.isConfirmed) {
            console.log('Logout cancelado pelo usuário');
            return;
        }
        
        console.log('✅ Logout confirmado, executando...');
        
        // Executar logout em múltiplas camadas
        const promessasLogout = [];
        
        // 1. AuthManager
        if (window.AuthManager && typeof window.AuthManager.realizarLogout === 'function') {
            promessasLogout.push(window.AuthManager.realizarLogout());
        }
        
        // 2. Supabase direto
        if (window.supabaseClient) {
            promessasLogout.push(window.supabaseClient.auth.signOut());
        }
        
        // Executar todos os logouts
        await Promise.allSettled(promessasLogout);
        
        console.log('✅ Logout executado em todas as camadas');
        
        // Mostrar mensagem de sucesso
        await Swal.fire({
            icon: 'success',
            title: 'Logout realizado!',
            text: 'Até logo!',
            timer: 1000,
            showConfirmButton: false
        });
        
        // Redirecionar para login
        console.log('🔄 Redirecionando para login...');
        window.location.replace('/index.html'); // replace evita voltar com botão voltar
        
    } catch (error) {
        console.error('❌ Erro durante logout:', error);
        
        // Mesmo com erro, forçar logout
        console.log('⚠️ Forçando logout mesmo com erro...');
        window.location.replace('/index.html');
    }
}

// Função para abrir modal de perfil (global para todas as páginas)
async function abrirModalPerfil() {
    console.log('👤 Abrindo modal de perfil...');
    
    try {
        // Obter usuário atual
        let usuario = null;
        
        if (window.AuthManager) {
            usuario = await window.AuthManager.obterUsuarioAtual();
        } else if (typeof obterUsuarioLogado === 'function') {
            usuario = await obterUsuarioLogado();
        }
        
        if (!usuario) {
            console.error('❌ Usuário não encontrado para abrir perfil');
            Swal.fire({
                icon: 'error',
                title: 'Erro',
                text: 'Não foi possível obter dados do usuário.',
                confirmButtonColor: '#4a7c59'
            });
            return;
        }
        
        // Verificar se modal existe na página
        const modal = document.getElementById('modalPerfil');
        if (!modal) {
            console.error('❌ Modal de perfil não encontrado na página');
            Swal.fire({
                icon: 'warning',
                title: 'Funcionalidade indisponível',
                text: 'O modal de perfil não está disponível nesta página.',
                confirmButtonColor: '#4a7c59'
            });
            return;
        }
        
        // Preencher dados atuais
        const nomeInput = document.getElementById('perfilNome');
        const emailInput = document.getElementById('perfilEmail');
        const usuarioInput = document.getElementById('perfilUsuario');
        const tipoInput = document.getElementById('perfilTipo');
        
        if (nomeInput) nomeInput.value = usuario.nome || '';
        if (emailInput) emailInput.value = usuario.email || '';
        if (usuarioInput) usuarioInput.value = usuario.usuario || '';
        if (tipoInput) tipoInput.value = usuario.prioridade === 'ADM' ? 'Administrador' : 'Vendedor';
        
        // Remover classes de validação
        document.querySelectorAll('#formPerfil .is-invalid').forEach(el => el.classList.remove('is-invalid'));
        
        // Abrir modal
        new bootstrap.Modal(modal).show();
        console.log('✅ Modal de perfil aberto');
        
    } catch (error) {
        console.error('❌ Erro ao abrir modal de perfil:', error);
        Swal.fire({
            icon: 'error',
            title: 'Erro',
            text: 'Ocorreu um erro ao abrir o perfil.',
            confirmButtonColor: '#4a7c59'
        });
    }
}

// Função para abrir modal de alterar senha (global para todas as páginas)
function abrirModalAlterarSenha() {
    console.log('🔑 Abrindo modal de alterar senha...');
    
    // Verificar se modal existe na página
    const modal = document.getElementById('modalAlterarSenha');
    if (!modal) {
        console.error('❌ Modal de alterar senha não encontrado na página');
        Swal.fire({
            icon: 'warning',
            title: 'Funcionalidade indisponível',
            text: 'O modal de alterar senha não está disponível nesta página.',
            confirmButtonColor: '#4a7c59'
        });
        return;
    }
    
    // Limpar formulário
    const form = document.getElementById('formAlterarSenha');
    if (form) form.reset();
    
    // Remover classes de validação
    document.querySelectorAll('#formAlterarSenha .is-invalid').forEach(el => el.classList.remove('is-invalid'));
    
    // Abrir modal
    new bootstrap.Modal(modal).show();
    console.log('✅ Modal de alterar senha aberto');
}

// Funções que devem existir nas páginas que usam o navbar
window.navbarFunctions = {
    configurarNavbar,
    configurarPermissoesNavbar,
    marcarPaginaAtiva,
    realizarLogout,
    abrirModalPerfil,
    abrirModalAlterarSenha
};

// Disponibilizar funções globalmente para compatibilidade
window.abrirModalPerfil = abrirModalPerfil;
window.abrirModalAlterarSenha = abrirModalAlterarSenha;
window.realizarLogout = realizarLogout;
</script>
